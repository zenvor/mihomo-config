# 3X-UI subconverter Mihomo profile template.
# Public subscription responses replace the placeholders below at render time.
# Keep Mihomo-specific rendering details in subconverter/service/mihomo_yaml.go.

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
log-level: info
external-controller: 127.0.0.1:9090

tcp-concurrent: true
unified-delay: true

ipv6: true

sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: 'https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat'
  geosite: 'https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat'

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  listen: 127.0.0.1:1053
  ipv6: false

  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.ptlogin2.qq.com'
    - 'geosite:category-ntp'
    - 'geosite:category-ntp-cn'
    - 'geosite:category-ntp-jp'
    - '+.l.google.com'
    - '+.miwifi.com'
    - '+.voip.qq.com'

  # Only explicitly classified domestic/private domains use domestic DNS.
  nameserver-policy:
    'geosite:cn,private,tld-cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

  # Foreign and unclassified domains use encrypted DNS through the selected proxy.
  # No domestic fallback: if the proxy is unavailable, these queries must fail.
  nameserver:
    - https://8.8.8.8/dns-query#PROXY
    - https://1.1.1.1/dns-query#PROXY

  # Resolve node hostnames independently to avoid a proxy/DNS bootstrap cycle.
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # Leave direct-nameserver unset so DIRECT connections follow the same policy.

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  main:
    type: http
    url: '__API_DOMAIN__/feed/__TOKEN__/nodes'
    path: ./providers/main.yaml
    override:
      # Explicitly enable UDP for rendered nodes that omit udp: true.
      udp: true
      # IPv4-only when dialing node servers (all nodes are IPv4 VPS); this does NOT control
      # the node's egress IP version toward target services. Switch to ipv4-prefer if a
      # pure-IPv6 node ever appears.
      ip-version: ipv4
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    use:
      - main

rules:
  # QUIC (UDP 443): use the Mihomo VLESS documentation's recommended rule to block HTTP/3
  # and force browsers back to TCP/443 instead of relying on QUIC sniffing or domain combos.
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # AI service domain rules take precedence over ad lists and domestic/IP routing.
  # Sources and scope are documented in README.md; QUIC rejection remains above.
  # OpenAI first-party domains (suffixes include all subdomains).
  - DOMAIN-SUFFIX,openai.com,PROXY
  - DOMAIN-SUFFIX,chatgpt.com,PROXY
  - DOMAIN-SUFFIX,oaistatic.com,PROXY
  - DOMAIN-SUFFIX,oaiusercontent.com,PROXY
  - DOMAIN-SUFFIX,oaistatsig.com,PROXY
  # Anthropic first-party domains, including Desktop artifacts and MCP widgets.
  - DOMAIN-SUFFIX,anthropic.com,PROXY
  - DOMAIN-SUFFIX,claude.ai,PROXY
  - DOMAIN-SUFFIX,claude.com,PROXY
  - DOMAIN-SUFFIX,claude.app,PROXY
  - DOMAIN-SUFFIX,claudeusercontent.com,PROXY
  - DOMAIN-SUFFIX,claudemcpcontent.com,PROXY
  # Shared dependencies listed by OpenAI and the supplied community list.
  - DOMAIN-SUFFIX,ct.sendgrid.net,PROXY
  - DOMAIN-SUFFIX,intercom.io,PROXY
  - DOMAIN-SUFFIX,intercomcdn.com,PROXY
  - DOMAIN-SUFFIX,sentry.io,PROXY
  - DOMAIN-SUFFIX,statsigapi.net,PROXY
  # OpenAI authentication, verification, CDN and telemetry dependencies.
  - DOMAIN,cdn.openaimerge.com,PROXY
  - DOMAIN,cdn.workos.com,PROXY
  - DOMAIN,challenges.cloudflare.com,PROXY
  - DOMAIN,forwarder.workos.com,PROXY
  - DOMAIN,frontend-apps-multi-region.workos.com,PROXY
  - DOMAIN,humb.apple.com,PROXY
  - DOMAIN,images.workoscdn.com,PROXY
  - DOMAIN,js.stripe.com,PROXY
  - DOMAIN,rum.browser-intake-datadoghq.com,PROXY
  - DOMAIN,setup.workos.com,PROXY
  - DOMAIN,workos.imgix.net,PROXY
  - DOMAIN,register.appattest.apple.com,PROXY
  # Claude Code downloads, plugins, changelog, telemetry and Artifact dependencies.
  - DOMAIN,storage.googleapis.com,PROXY
  - DOMAIN,registry.npmjs.org,PROXY
  - DOMAIN,github.com,PROXY
  - DOMAIN,raw.githubusercontent.com,PROXY
  - DOMAIN,http-intake.logs.us5.datadoghq.com,PROXY
  - DOMAIN,browser-intake-us5-datadoghq.com,PROXY
  - DOMAIN,formulae.brew.sh,PROXY
  - DOMAIN,fonts.googleapis.com,PROXY
  - DOMAIN,fonts.gstatic.com,PROXY
  - DOMAIN,cdnjs.cloudflare.com,PROXY
  - DOMAIN,cdn.jsdelivr.net,PROXY
  - DOMAIN,cdn.tailwindcss.com,PROXY
  - DOMAIN,code.jquery.com,PROXY
  - DOMAIN,unpkg.com,PROXY
  # Community additions; these are not an official exhaustive Anthropic inventory.
  - DOMAIN-SUFFIX,clau.de,PROXY
  - DOMAIN-SUFFIX,claudemcpclient.com,PROXY
  # Community CDN, authentication and analytics hosts.
  - DOMAIN,servd-anthropic-website.b-cdn.net,PROXY
  - DOMAIN,anthropic.com.cdn.cloudflare.net,PROXY
  - DOMAIN,anthropic.auth0.com,PROXY
  - DOMAIN,anthropic-com.ghost.io,PROXY
  - DOMAIN,cdn.usefathom.com,PROXY
  # Optional Gerrit dependency listed in Claude Code network requirements.
  - DOMAIN-WILDCARD,*-review.googlesource.com,PROXY
  # Community keyword rules also proxy unrelated domains containing these terms.
  - DOMAIN-KEYWORD,datadog,PROXY
  - DOMAIN-KEYWORD,sift,PROXY

  - GEOSITE,category-ads-all,REJECT
  - DOMAIN,www.icloud.com,PROXY
  - DOMAIN-SUFFIX,icloud-content.com,PROXY
  # Google Play 修复:授权/校验请求必须与 Play API 主体同走代理出口,避免 .cn 直连触发地区风控导致下载挂起
  - DOMAIN-SUFFIX,googleapis.cn,PROXY
  # Google Play 修复:APK 分发按节点机房分流——大陆运营商前缀(2x3/ni5/j5o,同 Loyalsoldier geosite:cn)直连毫秒级;海外节点(解析到 173.194/142.251 等谷歌全球 IP)必须走代理,大陆直连会 i/o timeout
  - DOMAIN-REGEX,^r+[0-9]+(---|\.)sn-(2x3|ni5|j5o)\w{5}\.xn--ngstr-lra8j\.com$,DIRECT
  - DOMAIN-REGEX,^r+[0-9]+(---|\.)sn-(2x3|ni5|j5o)\w{5}\.googlevideo\.com$,DIRECT
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,PROXY
  - GEOSITE,private,DIRECT
  - GEOSITE,icloud,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,tld-cn,DIRECT
  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,cn,DIRECT
  - GEOIP,lan,DIRECT,no-resolve
  # Resolve unmatched domains before checking whether the real IP belongs to CN.
  - GEOIP,CN,DIRECT
  # Route remaining traffic through PROXY. If the selected node does not support
  # UDP, Mihomo continues to the final UDP rejection rule instead of falling back
  # to DIRECT.
  - MATCH,PROXY
  - NETWORK,udp,REJECT
